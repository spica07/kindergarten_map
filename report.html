<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>자치구별 요약 리포트</title>
<meta name="description" content="서울 유치원 자치구별 현황 요약 리포트">
<meta name="theme-color" content="#F5A700">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icons/app-icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/app-icon-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="유치원 지도">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <svg class="sign-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2.6" y="12.4" width="4.4" height="9"/><rect x="9.8" y="7.6" width="4.4" height="13.8"/><rect x="17" y="3.4" width="4.4" height="18"/></svg>
    <div class="sign-text">
      <h1 class="app-title">지역별 요약 리포트</h1>
    </div>
    <a class="report-btn" href="index.html">지도로</a>
  </div>
  <p class="app-notice">서울 유치원 · 자료 조회일 <span id="surveyDate"></span> · 참고용입니다.</p>
</header>

<main class="container report-page">

  <!-- 핵심 지표 -->
  <section class="panel">
    <h2 class="report-section-title">한눈에 보기</h2>
    <div class="stat-tiles" id="statTiles"></div>
  </section>

  <!-- 설립 구분 분포 -->
  <section class="panel">
    <h2 class="report-section-title">설립 구분 분포</h2>
    <div class="status-chips" id="kindChips"></div>
  </section>

  <!-- 자치구별 기관 수 -->
  <section class="panel">
    <h2 class="report-section-title">자치구별 유치원 수</h2>
    <div class="district-bars" id="districtBars"></div>
    <p class="dash-hint">막대를 누르면 지도에서 해당 자치구만 볼 수 있어요</p>
  </section>

  <!-- 자치구별 상세 표 -->
  <section class="panel">
    <h2 class="report-section-title">자치구별 상세</h2>
    <div class="table-wrap">
      <table class="report-table" id="reportTable">
        <thead>
          <tr>
            <th>자치구</th><th>전체</th><th>공립</th><th>사립</th><th>특수학급</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <footer class="app-footer">
    <p>자료: <a href="https://data.seoul.go.kr/dataList/OA-20566/A/1/datasetView.do" target="_blank" rel="noopener">서울 열린데이터광장 「서울시 유치원 일반현황」</a> · 학급 편성·정원 등은 바뀔 수 있으니 지원 전 꼭 확인하세요.</p>
  </footer>
</main>

<div class="site-notice" role="note">
  © 2026 서울 유치원 지도 · 본 사이트는 정보 공유 목적으로 제공됩니다. 시설명·상표 등의 권리는 해당 권리자에게 있습니다.
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/report.js"></script>
</body>
</html>
